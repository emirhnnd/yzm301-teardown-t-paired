[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "powerlab"
version = "0.1.0"
description = "t-paired (dz) power analysis: a-priori and post-hoc"
requires-python = ">=3.9"
dependencies = ["scipy"]

[project.optional-dependencies]
test = ["pytest"]
mcp = ["mcp<2"]

[project.scripts]
gpower-clone = "powerlab.cli:main"
powerlab = "powerlab.cli:main"
powerlab-mcp = "powerlab_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
